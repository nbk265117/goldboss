# Build and test on every push to main and every pull request (Windows: the app is WPF + Windows OCR).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Core + infrastructure tests and the localization check: they must pass.
      - name: Tests
        shell: pwsh
        run: ./scripts/test.ps1 -SkipOcr

      # The OCR tests need Windows' French OCR language, which the hosted runners may lack: they are tried after
      # installing it, but a failure there only warns (they always run on the developer's PC before a release).
      - name: French OCR language
        shell: pwsh
        continue-on-error: true
        run: ./scripts/ci-install-ocr.ps1

      - name: OCR tests (informative)
        shell: pwsh
        continue-on-error: true
        run: dotnet test tests/DofusCompanion.Ocr.Tests -c Release --logger "trx;LogFileName=DofusCompanion.Ocr.Tests.trx" --results-directory artifacts/test-results

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
